services:
  db:
    image: postgres:16-alpine
    container_name: driftline-db
    restart: always
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline -d driftline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driftline-backend
    restart: always
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://driftline:driftline@db:5432/driftline_db
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
