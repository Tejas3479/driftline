name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: driftline
          POSTGRES_PASSWORD: driftline
          POSTGRES_DB: driftline_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Run Backend Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://driftline:driftline@127.0.0.1:5433/driftline_db"
          PGPASSWORD: driftline
        run: |
          alembic upgrade head
          psql -h 127.0.0.1 -p 5433 -U driftline -d driftline_db -c "INSERT INTO workspaces (id, name, created_at) VALUES (1, 'Default Workspace', now()) ON CONFLICT DO NOTHING;"
          pytest
        
  frontend-tests:
    name: Frontend (Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Run Frontend Tests (Vitest)
        run: npm run test

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Verify Frontend Build
        run: npm run build
